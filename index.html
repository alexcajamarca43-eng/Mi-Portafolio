<html lang="es">
<head>

  <title>Alex Cajamarca — Marketing Digital</title>

  <style>:root{--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--accent:#39ff7e;--text:#f0f0f0;--muted:#888;--border:#2a2a2a}*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--text);font-family:Space Grotesk,sans-serif;overflow-x:hidden}h1,h2,h3{font-family:Syne,sans-serif}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}@keyframes fadeUp{0%{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{0%,to{opacity:1}50%{opacity:0}}
@media (max-width: 768px) {
  html, body { overflow-x: hidden !important; }
  * { max-width: 100vw; box-sizing: border-box; }
}

/* ============================================
   RESPONSIVE DESIGN - MOBILE FIRST
   ============================================ */

/* --- NAVEGACIÓN --- */
@media (max-width: 768px) {
  nav {
    padding: 16px 20px !important;
  }
  nav > div:nth-child(2) {
    display: none !important;
  }
  nav > a:last-child {
    padding: 8px 16px !important;
    font-size: 0.75rem !important;
  }
}

/* --- SECCIÓN HERO (Inicio) --- */
@media (max-width: 900px) {
  #inicio {
    padding: 0 20px !important;
  }
  #inicio > div > div > div:first-child {
    grid-template-columns: 1fr !important;
    gap: 40px !important;
  }
  #inicio > div > div > div:last-child {
    grid-template-columns: repeat(2, 1fr) !important;
    margin-top: 40px !important;
  }
  #inicio h1 {
    font-size: clamp(2.5rem, 8vw, 4rem) !important;
  }
}

@media (max-width: 480px) {
  #inicio > div > div > div:last-child {
    grid-template-columns: repeat(2, 1fr) !important;
  }
  #inicio h1 {
    font-size: 2.5rem !important;
  }
  #inicio > div > div > div:first-child > div:first-child > div:nth-child(5) {
    flex-direction: column !important;
  }
  #inicio > div > div > div:first-child > div:first-child > div:nth-child(5) a {
    text-align: center !important;
  }
}

/* --- SOBRE MÍ --- */
@media (max-width: 900px) {
  #sobremi {
    padding: 80px 20px !important;
  }
  #sobremi > div > div {
    grid-template-columns: 1fr !important;
    gap: 48px !important;
  }
  #sobremi > div > div > div:last-child {
    grid-template-columns: repeat(2, 1fr) !important;
  }
}

@media (max-width: 480px) {
  #sobremi > div > div > div:last-child {
    grid-template-columns: 1fr !important;
  }
}

/* --- SERVICIOS --- */
@media (max-width: 900px) {
  #servicios {
    padding: 80px 20px !important;
  }
  #servicios > div > div:last-child {
    grid-template-columns: 1fr !important;
  }
  #servicios > div > div:last-child > div {
    padding: 36px 24px !important;
  }
}

/* --- MI TRABAJO (Portafolio) --- */
@media (max-width: 768px) {
  #mitrabajo {
    padding: 80px 20px !important;
  }
  #mitrabajo > div > div:last-child {
    padding: 48px 24px !important;
  }
  #mitrabajo a[href*="portafolio"] {
    font-size: 0.9rem !important;
    padding: 16px 32px !important;
  }
}

/* --- MÉTRICAS --- */
@media (max-width: 900px) {
  #metricas {
    padding: 80px 20px !important;
  }
  #metricas > div > div:nth-child(2) {
    grid-template-columns: 1fr !important;
  }
  #metricas > div > div:last-child {
    flex-direction: column !important;
    gap: 24px !important;
    padding: 28px 24px !important;
    text-align: center !important;
  }
}

@media (max-width: 768px) {
  /* Cards de métricas: de flex horizontal a flex vertical */
  #metricas > div > div:nth-child(2) > div {
    flex-direction: column !important;
    gap: 12px !important;
    padding: 28px 20px !important;
  }
  /* Número de métrica más pequeño */
  #metricas > div > div:nth-child(2) > div > div > div:first-child {
    font-size: 2rem !important;
  }
  /* Texto del label más pequeño */
  #metricas > div > div:nth-child(2) > div > div > div:nth-child(2) {
    font-size: 0.9rem !important;
  }
  /* Banner CTA de métricas */
  #metricas > div > div:last-child {
    flex-direction: column !important;
    gap: 20px !important;
    padding: 28px 20px !important;
    text-align: center !important;
    align-items: center !important;
  }
  #metricas > div > div:last-child > div {
    text-align: center !important;
  }
  #metricas > div > div:last-child > div > div:first-child {
    font-size: 1.1rem !important;
  }
  #metricas > div > div:last-child > a {
    width: 100% !important;
    text-align: center !important;
    box-sizing: border-box !important;
  }
}

/* --- CONTACTO --- */
@media (max-width: 900px) {
  #contacto {
    padding: 80px 20px !important;
  }
  #contacto > div > div > div {
    grid-template-columns: 1fr !important;
    gap: 48px !important;
  }
  #contacto h2 {
    font-size: clamp(2rem, 7vw, 3rem) !important;
  }
  #contacto > div > div > div > div:last-child {
    padding: 40px 28px !important;
  }
}

/* --- FOOTER --- */
@media (max-width: 768px) {
  footer {
    flex-direction: column !important;
    gap: 12px !important;
    text-align: center !important;
    padding: 24px 20px !important;
  }
}

/* --- HERO GRID (4 columnas de métricas) --- */
@media (max-width: 768px) {
  #inicio > div > div > div[style*="repeat(4"] {
    grid-template-columns: repeat(2, 1fr) !important;
  }
}

/* --- FOTO DE PERFIL EN MÓVIL --- */
@media (max-width: 768px) {
  #alex-photo {
    width: 90px !important;
    height: 115px !important;
  }
}

/* --- TIPOGRAFÍA GENERAL EN MÓVIL --- */
@media (max-width: 480px) {
  h1, h2, h3 {
    word-break: break-word !important;
  }
  section {
    padding-left: 16px !important;
    padding-right: 16px !important;
  }
}

/* --- TABLET (769px - 1024px) --- */
@media (min-width: 769px) and (max-width: 1024px) {
  #inicio {
    padding: 0 30px !important;
  }
  #sobremi,
  #servicios,
  #mitrabajo,
  #metricas,
  #contacto {
    padding: 80px 30px !important;
  }
  #inicio > div > div > div:first-child {
    gap: 40px !important;
  }
  #servicios > div > div:last-child {
    grid-template-columns: repeat(2, 1fr) !important;
  }
  #sobremi > div > div > div:last-child {
    grid-template-columns: 1fr 1fr !important;
  }
}
</style>

(function() {
  function applyMobileFixes() {
    if (window.innerWidth > 768) return;
    
    // Find all grid containers and make them responsive
    var allDivs = document.querySelectorAll('*');
    allDivs.forEach(function(el) {
      var s = el.style;
      if (!s) return;
      
      // Fix 4-col grids -> 2 cols on mobile
      if (s.gridTemplateColumns && s.gridTemplateColumns.includes('repeat(4')) {
        s.gridTemplateColumns = 'repeat(2, 1fr)';
      }
      // Fix 3-col grids -> 1 col on mobile
      if (s.gridTemplateColumns && s.gridTemplateColumns.includes('repeat(3')) {
        s.gridTemplateColumns = '1fr';
      }
      // Fix 2-col grids -> 1 col on mobile
      if (s.gridTemplateColumns && (s.gridTemplateColumns === '1fr 1fr' || s.gridTemplateColumns.includes('repeat(2'))) {
        s.gridTemplateColumns = '1fr';
      }
      // Fix large horizontal padding
      if (s.padding && (s.padding === '0 40px' || s.padding === '0px 40px')) {
        s.padding = '0 20px';
      }
      if (s.paddingLeft === '40px') s.paddingLeft = '20px';
      if (s.paddingRight === '40px') s.paddingRight = '20px';
      // Fix fixed image widths
      if (s.width && parseInt(s.width) > 300 && el.tagName === 'IMG') {
        s.width = '100%';
        s.height = 'auto';
        s.maxWidth = '100%';
      }
      // Fix large gap values on grid
      if (s.gap && parseInt(s.gap) > 40 && s.display === 'grid') {
        s.gap = '24px';
      }
    });
    
    // Hide desktop nav links
    var navLinks = document.querySelector('nav > div:last-child');
    if (navLinks && navLinks.children.length > 2) {
      navLinks.style.display = 'none';
    }
  }
  
  // Run after React renders
  setTimeout(applyMobileFixes, 100);
  setTimeout(applyMobileFixes, 500);
  window.addEventListener('resize', applyMobileFixes);
})();

      wrapper.dataset.photoWrapped = '1';
      var flex = document.createElement('div');
      flex.style.cssText = 'display:flex;align-items:center;gap:20px;flex-wrap:wrap;';
      wrapper.insertBefore(flex, target);
      flex.appendChild(photo);
      flex.appendChild(target);
      photo.style.display = 'block';
    }
  }
  setTimeout(tryPlace, 300);
  setTimeout(tryPlace, 700);
  setTimeout(tryPlace, 1500);
})();
</script>
